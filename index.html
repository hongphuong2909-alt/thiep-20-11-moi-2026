<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chúc M?ng Ngày Nhà Giáo Vi?t Nam 20/11</title>
<link href="https://googleapis.com" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #fdfbfb 0%, #f6e6ea 100%);
    font-family: 'Quicksand', sans-serif;
    overflow: hidden;
  }

  /* Màn hình phong bì ban d?u */
  #envelope-screen {
    text-align: center;
    cursor: pointer;
    transition: opacity 0.8s ease, transform 0.8s ease;
    z-index: 10;
  }
  .envelope {
    width: 240px;
    height: 160px;
    background: #e86f88;
    border-radius: 12px;
    position: relative;
    margin: 0 auto 20px;
    box-shadow: 0 15px 35px rgba(232, 111, 136, 0.35);
    display: flex;
    justify-content: center;
    align-items: center;
    animation: float 3s ease-in-out infinite;
  }
  .envelope::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    border-left: 120px solid transparent;
    border-right: 120px solid transparent;
    border-top: 90px solid #f28ba0;
    border-radius: 12px 12px 0 0;
  }
  .heart-seal {
    width: 46px;
    height: 46px;
    background: #fff;
    border-radius: 50%;
    z-index: 2;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 22px;
    color: #e86f88;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
  }
  .open-btn {
    background: #d9536f;
    color: #fff;
    border: none;
    padding: 12px 28px;
    border-radius: 30px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 6px 15px rgba(217, 83, 111, 0.3);
    transition: transform 0.2s;
  }
  .open-btn:hover { transform: scale(1.05); }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  /* N?i dung thi?p chính */
  #card-screen {
    display: none;
    position: relative;
    width: 90%;
    max-width: 650px;
    min-height: 420px;
    background: rgba(255, 255, 255, 0.92);
    border-radius: 24px;
    padding: 40px 30px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(180, 90, 110, 0.2);
    border: 2px solid #f7d6de;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    animation: cardFadeIn 1.2s ease forwards;
  }

  @keyframes cardFadeIn {
    from { opacity: 0; transform: scale(0.85); }
    to { opacity: 1; transform: scale(1); }
  }

  /* Hi?u ?ng hoa n? */
  .flower {
    position: absolute;
    width: 75px;
    height: 75px;
    transform: scale(0) rotate(-45deg);
    opacity: 0;
  }
  .bloom {
    animation: bloomAnim 1.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  @keyframes bloomAnim {
    to {
      transform: scale(1) rotate(0deg);
      opacity: 1;
    }
  }

  /* V? trí các bông hoa */
  .f1 { top: -25px; left: -20px; animation-delay: 0.4s; }
  .f2 { top: -25px; right: -20px; animation-delay: 0.9s; }
  .f3 { bottom: -25px; left: -20px; animation-delay: 1.4s; }
  .f4 { bottom: -25px; right: -20px; animation-delay: 1.9s; }
  .f5 { top: 42%; left: -32px; width: 60px; height: 60px; animation-delay: 2.3s; }
  .f6 { top: 42%; right: -32px; width: 60px; height: 60px; animation-delay: 2.7s; }

  /* Dòng ch? chính */
  .title {
    font-family: 'Dancing Script', cursive;
    font-size: 38px;
    color: #c93b5b;
    margin-bottom: 18px;
    opacity: 0;
    transform: translateY(20px);
    animation: textAppear 1.5s ease forwards;
    animation-delay: 3.1s;
    line-height: 1.3;
  }

  .subtitle {
    font-size: 17px;
    color: #555;
    line-height: 1.7;
    max-width: 480px;
    opacity: 0;
    transform: translateY(15px);
    animation: textAppear 1.5s ease forwards;
    animation-delay: 4.2s;
  }

  @keyframes textAppear {
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* Cánh hoa roi nh? nhàng */
  .petal {
    position: fixed;
    top: -10%;
    background: #ffb7c5;
    border-radius: 150% 0 150% 0;
    opacity: 0.75;
    pointer-events: none;
    animation: fall linear infinite;
  }
  @keyframes fall {
    0% { transform: translateY(0) rotate(0deg); }
    100% { transform: translateY(115vh) rotate(360deg); }
  }

  @media (max-width: 500px) {
    .title { font-size: 30px; }
    .subtitle { font-size: 15px; }
    .flower { width: 58px; height: 58px; }
  }
</style>
</head>
<body>

  <!-- Màn hình phong bì -->
  <div id="envelope-screen" onclick="openCard()">
    <div class="envelope">
      <div class="heart-seal">??</div>
    </div>
    <button class="open-btn">B?m d? m? thi?p 20/11</button>
  </div>

  <!-- Màn hình thi?p chính -->
  <div id="card-screen">
    <!-- 6 bông hoa SVG -->
    <div class="flower f1" id="fl1"></div>
    <div class="flower f2" id="fl2"></div>
    <div class="flower f3" id="fl3"></div>
    <div class="flower f4" id="fl4"></div>
    <div class="flower f5" id="fl5"></div>
    <div class="flower f6" id="fl6"></div>

    <h1 class="title">Chúc m?ng ngày<br>Nhà giáo Vi?t Nam 20/11</h1>
    <p class="subtitle">
      Kính chúc th?y cô luôn m?nh kh?e, h?nh phúc và gi? mãi ng?n l?a nhi?t huy?t trên hành trình chèo lái nh?ng chuy?n dò tri th?c!
    </p>
  </div>

<script>
  // V? bông hoa 5 cánh b?ng SVG
  const flowerSVG = (color1, color2) => `
    <svg viewBox="0 0 100 100" width="100%" height="100%">
      <g transform="translate(50,50)">
        ${[0, 72, 144, 216, 288].map(angle => `
          <ellipse cx="0" cy="-24" rx="14" ry="22" fill="${color1}" transform="rotate(${angle})" opacity="0.9"/>
          <ellipse cx="0" cy="-20" rx="9" ry="15" fill="${color2}" transform="rotate(${angle})"/>
        `).join('')}
        <circle cx="0" cy="0" r="9" fill="#ffd166"/>
        <circle cx="0" cy="0" r="4" fill="#f4a261"/>
      </g>
    </svg>
  `;

  // Gán màu hoa da d?ng
  document.getElementById('fl1').innerHTML = flowerSVG('#ff8fa3', '#ffb3c1');
  document.getElementById('fl2').innerHTML = flowerSVG('#ff758f', '#ffccd5');
  document.getElementById('fl3').innerHTML = flowerSVG('#f7a072', '#ffd6ba');
  document.getElementById('fl4').innerHTML = flowerSVG('#ff8fa3', '#fff0f3');
  document.getElementById('fl5').innerHTML = flowerSVG('#e0aaff', '#f3d5ff');
  document.getElementById('fl6').innerHTML = flowerSVG('#ff9ebb', '#ffe5ec');

  // T?o nh?c piano nh? nhàng b?ng Web Audio API (không c?n file mp3 ngoài)
  function playGentleMusic() {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const ctx = new AudioContext();
    
    // Giai di?u nh? nhàng (t?n s? các n?t nh?c)
    const melody = [
      { freq: 523.25, dur: 0.6 }, // C5
      { freq: 659.25, dur: 0.6 }, // E5
      { freq: 783.99, dur: 0.8 }, // G5
      { freq: 659.25, dur: 0.6 }, // E5
      { freq: 587.33, dur: 0.6 }, // D5
      { freq: 698.46, dur: 0.6 }, // F5
      { freq: 880.00, dur: 1.0 }, // A5
      { freq: 783.99, dur: 1.2 }, // G5
      { freq: 659.25, dur: 0.6 }, // E5
      { freq: 587.33, dur: 0.6 }, // D5
      { freq: 523.25, dur: 1.4 }  // C5
    ];

    let time = ctx.currentTime + 0.2;
    melody.forEach(note => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(note.freq, time);

      gain.gain.setValueAtTime(0.001, time);
      gain.gain.exponentialRampToValueAtTime(0.15, time + 0.08);
      gain.gain.exponentialRampToValueAtTime(0.0001, time + note.dur);

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start(time);
      osc.stop(time + note.dur);
      time += note.dur * 0.85;
    });
  }

  // T?o hi?u ?ng cánh hoa roi
  function createPetals() {
    for (let i = 0; i < 18; i++) {
      const petal = document.createElement('div');
      petal.className = 'petal';
      const size = Math.random() * 10 + 8 + 'px';
      petal.style.width = size;
      petal.style.height = size;
      petal.style.left = Math.random() * 100 + 'vw';
      petal.style.animationDuration = Math.random() * 4 + 5 + 's';
      petal.style.animationDelay = Math.random() * 5 + 's';
      document.body.appendChild(petal);
    }
  }

  // Hàm m? thi?p
  function openCard() {
    const envScreen = document.getElementById('envelope-screen');
    const cardScreen = document.getElementById('card-screen');

    envScreen.style.opacity = '0';
    envScreen.style.transform = 'scale(0.9)';

    playGentleMusic();

    setTimeout(() => {
      envScreen.style.display = 'none';
      cardScreen.style.display = 'flex';
      
      // Kích ho?t hi?u ?ng hoa n?
      document.querySelectorAll('.flower').forEach(fl => {
        fl.classList.add('bloom');
      });

      createPetals();
    }, 600);
  }
</script>
</body>
</html>
